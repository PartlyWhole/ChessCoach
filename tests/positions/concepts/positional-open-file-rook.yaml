concept: positional-open-file-rook
engine: {name: "Stockfish 19", depth: 16}
# Role: played only. The moved piece is a rook and the move puts it on a file with no pawns
# (open_file with the player's rook/queen among data.occupants).
cases:
  - id: played-white-rook-to-open-d-file
    fen: "r4rk1/pp3ppp/2p2n2/8/8/2N5/PPP2PPP/R4RK1 w - - 0 15"
    move: "f1d1"
    expect: {role: played, present: true, slots: {file: d}}
  - id: played-black-rook-to-open-e-file
    fen: "r4rk1/pp3ppp/2p2n2/8/8/2N5/PPP2PPP/R4RK1 b - - 0 15"
    move: "f8e8"
    expect: {role: played, present: true, slots: {file: e}}
  - id: played-doubling-on-open-file
    fen: "r4rk1/pp3ppp/2p2n2/8/8/2N5/PPPR1PPP/R5K1 w - - 0 16"
    move: "a1d1"
    band: B3
    expect: {role: played, present: true, slots: {file: d}}
    note: "The second rook joins the first on the open d-file."
  - id: neg-rook-to-half-open-file
    fen: "r4rk1/pp2pppp/2p2n2/8/8/2N5/PPP2PPP/R4RK1 w - - 0 15"
    move: "f1e1"
    expect: {role: played, present: false}
    note: "Near miss: the e-file still has Black's e7 pawn, so it is half-open, not open."
  - id: neg-queen-not-rook
    fen: "r4rk1/pp3ppp/2p2n2/8/8/2N5/PPP1QPPP/R4RK1 w - - 0 15"
    move: "e2d3"
    expect: {role: played, present: false}
    note: "Near miss: the queen goes to the open d-file; the concept is about rooks."
  - id: neg-rook-already-on-open-file-moves-along-it
    fen: "r4rk1/pp3ppp/2p2n2/8/8/2N5/PPP2PPP/3R2K1 w - - 0 15"
    move: "d1d4"
    expect: {role: played, present: false}
    note: "Near miss: the rook already held the open d-file; Rd1-d4 moves along it. Saying 'Your rook takes the open d-file' would be false — it did not take anything new."
