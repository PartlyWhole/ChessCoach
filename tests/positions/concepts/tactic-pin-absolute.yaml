concept: tactic-pin-absolute
engine: {name: "Stockfish 19", depth: 16}
cases:
  - id: rook-pins-queen-to-king-available
    fen: "rnb1k2r/ppp2ppp/8/4q3/8/3Q4/PPP2PPP/R4K1R w - - 0 1"
    expect: {role: available, slots: {pinned: e5, pinner: e1, pinned_piece: queen}}
    note: "Re1 pins Qe5 to Ke8 (e1 guarded by Kf1); Black must give the queen for the rook. Rh1 cannot reach e1, so Rae1 is the only pinning move."
  - id: rook-pins-queen-to-king-missed
    fen: "rnb1k2r/ppp2ppp/8/4q3/8/3Q4/PPP2PPP/R4K1R w - - 0 1"
    move: a2a3
    expect: {role: missed, slots: {pinned: e5, pinner: e1}}
    note: "a3 ignores Re1 and Black takes on b2: a blunder by win probability."
  - id: rook-pins-queen-to-king-played
    fen: "rnb1k2r/ppp2ppp/8/4q3/8/3Q4/PPP2PPP/R4K1R w - - 0 1"
    move: a1e1
    expect: {role: played, slots: {pinned: e5, pinner: e1}}
    note: "Re1 is the only move that wins (engine: next best loses). The static pin is new after the move and involves e1."
  - id: queen-walks-into-pin-allowed
    fen: "rnb1k2r/ppp2ppp/8/6q1/8/3Q4/PPP2PPP/R4K1R b - - 0 1"
    move: g5e5
    expect: {role: allowed, slots: {pinned: e5, pinner: e1}}
    note: "...Qe5?? lines the queen up with the king on the open e-file; Re1 wins it."
  - id: pin-already-played-not-missed
    fen: "rnb1k2r/ppp2ppp/8/4q3/8/3Q4/PPP2PPP/R4K1R w - - 0 1"
    move: a1e1
    expect: {role: missed, present: false}
    note: "Near miss: the player found Re1, so nothing was missed."
  - id: nimzo-pin-wins-nothing
    fen: "rnbqkb1r/pppp1ppp/4pn2/8/2PP4/2N5/PP2PPPP/R1BQKBNR b KQkq - 1 3"
    move: f8b4
    expect: {role: played, present: false}
    note: "Near miss: ...Bb4 pins Nc3 to Ke1 (a real absolute pin) but it is a normal opening move that gains nothing over alternatives."
