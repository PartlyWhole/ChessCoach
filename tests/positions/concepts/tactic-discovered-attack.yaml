concept: tactic-discovered-attack
engine: {name: "Stockfish 19", depth: 16}
cases:
  - id: knight-takes-bishop-uncovers-rook-on-queen-available
    fen: "r2q1rk1/pp3ppp/2b5/8/3N4/8/PPP1QPPP/3R1RK1 w - - 0 1"
    expect: {role: available, slots: {slider: d1, target: d8, target_piece: queen, moved_piece: knight}}
    note: "Nxc6 takes the bishop and uncovers Rd1 on Qd8; Black must save the queen and cannot recapture (bxc6 Rxd8)."
