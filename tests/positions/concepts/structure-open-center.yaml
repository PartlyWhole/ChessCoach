# Plan-role tests for structure-open-center (docs/08 §1). Classifier: chesscoach/analysis/structure.py (02 §6.3).
concept: structure-open-center
engine: {name: "Stockfish 19", depth: 16}
cases:
  - id: open-center-one-e-pawn
    fen: "r1bq1rk1/ppp2ppp/2n2n2/2b5/2B1P3/2N2N2/PPP2PPP/R1BQ1RK1 w - - 0 8"
    band: B3
    expect: {role: plan, present: true, slots: {plan: "With open central files, piece activity matters most. Get your rooks to the open files."}}
    note: "Only e4 on the d/e files; no named structure applies."
  - id: open-center-one-e-pawn-black-to-move
    fen: "r1bq1rk1/ppp2ppp/2n2n2/2b5/2B1P3/2N2N2/PPP2PPP/R1BQ1RK1 b - - 1 8"
    band: B3
    expect: {role: plan, present: true, slots: {plan: "With open central files, piece activity matters most. Get your rooks to the open files."}}
    note: "Same position, Black to move: ownerless structure uses the owner list."
  - id: open-center-empty
    fen: "r1bqr1k1/ppp2ppp/2n2n2/2b5/2B5/2N2N2/PPP2PPP/R1BQR1K1 w - - 0 10"
    band: B3
    expect: {role: plan, present: true}
    note: "No d/e pawns at all."
  - id: open-center-no-black-c-d-e
    fen: "r2qr1k1/pp3ppp/2n2n2/2b2b2/8/2N2N2/PPP1BPPP/R1BQR1K1 b - - 1 11"
    band: B3
    expect: {role: plan, present: true}
    note: "No d/e pawns; Black's c-pawn gone too."
  - id: open-center-near-miss-two-pawns
    fen: "r1bq1rk1/ppp1bppp/2np1n2/8/2B1P3/2N2N2/PPP2PPP/R1BQ1RK1 w - - 0 8"
    band: B3
    expect: {role: plan, present: false}
    note: "Near miss: two pawns on d/e files (e4, d6)."
  - id: open-center-near-miss-iqp-wins
    fen: "r1bqr1k1/pp3ppp/2nb1n2/8/3P4/2NB1N2/PP3PPP/R1BQR1K1 w - - 0 14"
    band: B3
    expect: {role: plan, present: false}
    note: "Near miss: only one d/e pawn, but the named IQP structure takes precedence."
