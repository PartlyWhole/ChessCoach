detector: pin_relative
cases:
- id: qgd-bg5-pins-nf6-to-queen
  fen: rnbqkb1r/ppp2ppp/4pn2/3p2B1/2PP4/2N5/PP2PPPP/R2QKBNR b KQkq - 3 4
  expect:
    present: true
    side: white
    squares_include:
    - f6
  note: 'QGD 4.Bg5 before ...Be7: Nf6 is pinned to Qd8 (e7 empty); if it moves, Bxd8.'
- id: rook-pins-knight-to-queen
  fen: 4k3/pp2qppp/8/4n3/8/8/PP3PPP/4R1K1 w - - 0 1
  expect:
    present: true
    side: white
    squares_include:
    - e5
  note: Re1 attacks Ne5 with Qe7 behind; if the knight moves, Rxe7 wins the queen for a rook (Kxe7).
- id: bb5-pins-nc6-to-rook
  fen: r1bqr1k1/ppp2ppp/2np1n2/1B6/4P3/2N2N2/PPP2PPP/R2Q1RK1 w - - 0 1
  expect:
    present: true
    side: white
    squares_include:
    - c6
  note: Bb5 pins Nc6 to Re8 (d7 empty); with the knight gone Bxe8 wins the exchange even after the recapture.
- id: bishop-pins-rook-to-queen
  fen: 6k1/5qpp/8/3r4/8/1B6/PP3PPP/6K1 w - - 0 1
  expect:
    present: true
    side: white
    squares_include:
    - d5
  note: Bb3 attacks Rd5 with Qf7 behind on the same diagonal; the rook cannot capture the bishop diagonally.
- id: black-bg4-pins-nf3-to-queen
  fen: rn1qkbnr/ppp2ppp/3p4/4p3/2B1P1b1/5N2/PPPP1PPP/RNBQK2R w KQkq - 2 4
  expect:
    present: true
    side: black
    squares_include:
    - f3
  note: '1.e4 e5 2.Nf3 d6 3.Bc4 Bg4: Nf3 is pinned to Qd1 (e2 empty). side = black.'
- id: rook-pins-bishop-to-queen
  fen: 3q2k1/5ppp/8/3b4/8/8/5PPP/3R2K1 w - - 0 1
  expect:
    present: true
    side: white
    squares_include:
    - d5
  note: Rd1 attacks Bd5 with the undefended Qd8 behind on the d-file.
- id: behind-is-lower-value
  fen: 3b2k1/5ppp/8/3q4/8/8/5PPP/2QR2K1 w - - 0 1
  expect:
    present: false
  note: 'Near miss: Rd1 attacks Qd5 with Bd8 behind; the back piece is LOWER value, so this is a skewer, not a relative pin.'
- id: pinned-piece-can-take-pinner
  fen: rnbqk2r/ppp1bppp/4pn2/3p2B1/2PP4/2N2N2/PP2PPPP/R2QKB1R b KQkq - 5 5
  expect:
    present: false
  note: 'Near miss: Bg5 attacks Be7 with Qd8 behind, but Be7 can capture the pinner (Bxg5 Nxg5 is an even trade, SEE >= 0).'
- id: back-piece-defended-even-trade
  fen: r2r2k1/5ppp/8/3b4/8/8/5PPP/3R2K1 w - - 0 1
  expect:
    present: false
  note: 'Near miss: Rd1 attacks Bd5 with Rd8 behind, but Rd8 is defended by Ra8; Rxd8+ Rxd8 nets 0, so winning it gains nothing.'
- id: queen-pins-to-defended-rook
  fen: r2r2k1/5ppp/8/3n4/8/8/5PPP/3Q2K1 w - - 0 1
  expect:
    present: false
  note: 'Near miss: Qd1 attacks Nd5 with Rd8 behind, but Qxd8+ Rxd8 loses the queen for a rook (SEE 0 for us).'
- id: two-pieces-between
  fen: r1bqkb1r/pppp1ppp/2n2n2/1B2p3/4P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4
  expect:
    present: false
  note: Bb5 attacks Nc6 but d7 stands behind it (pawn, lower value) and shields e8; no relative pin.
- id: behind-is-king
  fen: rnbqk2r/pppp1ppp/4pn2/8/1bPP4/2N5/PP2PPPP/R1BQKBNR w KQkq - 2 4
  expect:
    present: false
  note: 'Nimzo pin: the piece behind Nc3 is the king, which makes it pin_absolute, not pin_relative.'
