detector: half_open_file
# 02 §6.2: a file with no pawns of side S but at least one enemy pawn. Emitted
# for S (the side that may use it); data.file is the file letter and
# data.occupants lists S's rooks/queens on it (assumed: their squares).
cases:
  - id: open-sicilian-d-file-white
    fen: "rnbqkb1r/pp2pppp/3p1n2/8/3NP3/2N5/PPP2PPP/R1BQKB1R b KQkq - 2 5"
    expect: {present: true, side: white, data: {file: "d"}}
    note: "White traded the d-pawn; Black's d6 remains."
  - id: open-sicilian-c-file-black
    fen: "rnbqkb1r/pp2pppp/3p1n2/8/3NP3/2N5/PPP2PPP/R1BQKB1R b KQkq - 2 5"
    expect: {present: true, side: black, data: {file: "c"}}
    note: "Black traded the c-pawn; White's c2 remains."
  - id: carlsbad-e-file-black
    fen: "r1bq1rk1/pp1nbppp/2p2n2/3p2B1/3P4/2NBP3/PPQ1NPPP/R3K2R w KQ - 2 9"
    expect: {present: true, side: black, data: {file: "e"}}
    note: "QGD Exchange: Black has no e-pawn, White has e3."
  - id: carlsbad-c-file-rook
    fen: "r2q1rk1/pp1nbppp/2p1bn2/3p4/3P4/2NBPN2/PP3PPP/2RQ1RK1 b - - 3 10"
    expect: {present: true, side: white, data: {file: "c", occupants: ["c1"]}}
    note: "Minority-attack setup: Rc1 on White's half-open c-file (Black pawn on c6)."
  - id: f-file-rook
    fen: "r1bq1rk1/ppp2ppp/2np1n2/2b1p3/2B1P3/2NP1N2/PPP3PP/R1BQ1RK1 w - - 0 7"
    expect: {present: true, side: white, data: {file: "f", occupants: ["f1"]}}
    note: "White's f-pawn is gone, Black's f7 remains; Rf1 is the occupant."
  - id: enemy-passer-half-opens-file
    fen: "2r3k1/pp3ppp/3P4/8/8/8/PP3PPP/2R3K1 w - - 0 25"
    expect: {present: true, side: black, data: {file: "d"}}
    note: "Only a White pawn (d6) is on the d-file, so it is half-open for Black."
  - id: own-passer-not-half-open
    fen: "2r3k1/pp3ppp/3P4/8/8/8/PP3PPP/2R3K1 w - - 0 25"
    expect: {present: false, side: white, data: {file: "d"}}
    note: "Near miss: White has a pawn on the d-file (far advanced on d6), so the file is not half-open for White."
  - id: open-file-is-not-half-open
    fen: "r2qkb1r/pp2pppp/2n2n2/3p1b2/3P1B2/2N1P3/PP3PPP/R2QKBNR w KQkq - 2 7"
    expect: {present: false, data: {file: "c"}}
    note: "Near miss: the c-file has no pawns at all -- open, not half-open."
  - id: sicilian-c-file-not-whites
    fen: "rnbqkb1r/pp2pppp/3p1n2/8/3NP3/2N5/PPP2PPP/R1BQKB1R b KQkq - 2 5"
    expect: {present: false, side: white, data: {file: "c"}}
    note: "Side convention: the half-open c-file belongs to Black (the side without a c-pawn)."
  - id: najdorf-d-file-not-blacks
    fen: "r2q1rk1/1p1bbppp/p2p1n2/3Np3/4P3/1N6/PPP1BPPP/R2Q1RK1 b - - 3 12"
    expect: {present: false, side: black, data: {file: "d"}}
    note: "Black still has d6; only White may use the d-file."
  - id: starting-position
    fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"
    expect: {present: false}
    note: "Every file has pawns of both sides."
  - id: carlsbad-no-black-rook-on-e
    fen: "r1bq1rk1/pp1nbppp/2p2n2/3p2B1/3P4/2NBP3/PPQ1NPPP/R3K2R w KQ - 2 9"
    expect: {present: false, side: black, data: {file: "e", occupants: ["e8"]}}
    note: "The e-file is half-open for Black, but no Black rook/queen stands on it yet."
