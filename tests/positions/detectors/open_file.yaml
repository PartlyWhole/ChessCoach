detector: open_file
# 02 §6.2: a file with no pawns at all. One feature per side that may use the
# file (both sides for an open file); data.file is the file letter and
# data.occupants lists that side's rooks/queens on it (assumed: their squares).
cases:
  - id: exchange-slav-c-file-white
    fen: "r2qkb1r/pp2pppp/2n2n2/3p1b2/3P1B2/2N1P3/PP3PPP/R2QKBNR w KQkq - 2 7"
    expect: {present: true, side: white, data: {file: "c"}}
    note: "Both c-pawns were exchanged: the c-file is open for White."
  - id: exchange-slav-c-file-black
    fen: "r2qkb1r/pp2pppp/2n2n2/3p1b2/3P1B2/2N1P3/PP3PPP/R2QKBNR w KQkq - 2 7"
    expect: {present: true, side: black, data: {file: "c"}}
    note: "An open file is emitted once per side; Black may use the c-file too."
  - id: doubled-rooks-open-d-file-white
    fen: "3r1rk1/pp3ppp/2n1pn2/8/8/2N1PN2/PP3PPP/2RR2K1 w - - 0 15"
    expect: {present: true, side: white, data: {file: "d", occupants: ["d1"]}}
    note: "Open d-file with White's rook on d1 listed as occupant."
  - id: open-d-file-black-rook
    fen: "3r1rk1/pp3ppp/2n1pn2/8/8/2N1PN2/PP3PPP/2RR2K1 w - - 0 15"
    expect: {present: true, side: black, data: {file: "d", occupants: ["d8"]}}
    note: "Black's rook on d8 is Black's occupant of the same open file."
  - id: exchange-french-e-file-pieces-only
    fen: "r1bqr1k1/ppp2ppp/2nb1n2/3p4/3P4/2NB1N2/PPP2PPP/R1BQR1K1 w - - 6 8"
    expect: {present: true, side: white, data: {file: "e", occupants: ["e1"]}}
    note: "Near miss for 'blocked file': rooks face each other on the e-file but no pawns stand on it, so it is open."
  - id: queen-on-open-d-file
    fen: "r4rk1/pp3ppp/2n1pn2/8/8/2NQPN2/PP3PPP/R4RK1 b - - 1 13"
    expect: {present: true, side: white, data: {file: "d", occupants: ["d3"]}}
    note: "Occupants include queens as well as rooks."
  - id: open-sicilian-c-file-is-half-open
    fen: "rnbqkb1r/pp2pppp/3p1n2/8/3NP3/2N5/PPP2PPP/R1BQKB1R b KQkq - 2 5"
    expect: {present: false, data: {file: "c"}}
    note: "Near miss: Black has no c-pawn but White still has c2 -- half-open, not open."
  - id: open-sicilian-d-file-is-half-open
    fen: "rnbqkb1r/pp2pppp/3p1n2/8/3NP3/2N5/PPP2PPP/R1BQKB1R b KQkq - 2 5"
    expect: {present: false, data: {file: "d"}}
    note: "Near miss: a single Black pawn (d6) on the file keeps it from being open."
  - id: starting-position
    fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"
    expect: {present: false}
    note: "Every file has pawns."
  - id: advanced-passer-closes-file
    fen: "2r3k1/pp3ppp/3P4/8/8/8/PP3PPP/2R3K1 w - - 0 25"
    expect: {present: false, data: {file: "d"}}
    note: "Near miss: the only pawn on the d-file is White's passer on d6; any pawn means not open."
  - id: open-c-file-no-black-rook
    fen: "3r1rk1/pp3ppp/2n1pn2/8/8/2N1PN2/PP3PPP/2RR2K1 w - - 0 15"
    expect: {present: false, side: black, data: {file: "c", occupants: ["c8"]}}
    note: "The c-file is open for Black too, but Black has no rook/queen on it (occupants empty)."
  - id: exchange-slav-d-file-both-pawns
    fen: "r2qkb1r/pp2pppp/2n2n2/3p1b2/3P1B2/2N1P3/PP3PPP/R2QKBNR w KQkq - 2 7"
    expect: {present: false, data: {file: "d"}}
    note: "d4/d5 are both on the d-file: not open."
