# Pawn-structure classifier (02 §6.3). owner is asserted only where the template has an
# unambiguous owning side (iqp, hanging_pawns, stonewall) and is null for the fallbacks.
detector: structure
cases:
- id: iqp-white
  fen: r1bq1rk1/pp2bppp/2n1pn2/8/3P4/2NB1N2/PP3PPP/R1BQ1RK1 w - - 0 11
  expect:
    present: true
    data:
      structure_id: iqp
      owner: white
  note: White d4, no White c/e pawns, no Black d-pawn.
- id: iqp-black
  fen: r1bq1rk1/pp3ppp/2nb1n2/3p4/8/2N1PN2/PP2BPPP/R1BQ1RK1 b - - 0 11
