    present: true
    data:
      structure_id: iqp
      owner: black
  note: Colour-reversed IQP.
- id: hanging-white
  fen: 2rq1rk1/pb2bppp/1p2pn2/8/2PP4/3B1N2/PB3PPP/2RQ1RK1 w - - 0 16
  expect:
    present: true
    data:
      structure_id: hanging_pawns
      owner: white
  note: White c4+d4, no b/e pawns; Black has no c/d pawns.
- id: hanging-black
  fen: 2rq1rk1/pb2bppp/5n2/2pp4/8/1P1BPN2/PB2QPPP/2RR2K1 w - - 0 16
