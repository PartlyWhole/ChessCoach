    2: Watch the line from the {slider_piece} on {slider} to your king.
    3: After your move, {move_san} gives a discovered check.
  played:
    0: Good. Your {moved_piece} moved and uncovered check from your {slider_piece}.
  available:
    1: Can you give check by moving a different piece?
    2: Look at your {slider_piece} on {slider}.
    3: '{move_san} gives a discovered check.'
drill:
