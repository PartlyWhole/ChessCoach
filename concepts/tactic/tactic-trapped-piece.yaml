  allowed:
    1: Does every one of your pieces still have a safe square?
    2: Your {piece} on {square} is running out of squares.
    3: After your move, {move_san} traps your {piece} on {square}.
  played:
    0: Nice. The {piece} on {square} has no safe square left.
  available:
    1: Is one of your opponent's pieces short of squares?
    2: Look at the {piece} on {square}.
    3: '{move_san} traps the {piece} on {square}.'
drill:
  kind: find_move
  max_solution_plies: 3
