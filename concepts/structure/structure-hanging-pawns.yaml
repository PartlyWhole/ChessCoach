plans:
  owner:
  - Keep the pawns side by side. Together they control key central squares.
  - Advance one of them only when it wins space or opens lines for your pieces.
  opponent:
  - Provoke one of the pawns to advance, then blockade the square in front of it.
  - Attack the pawns with pieces; once one advances, the other can become weak.
