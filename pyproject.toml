[project]
name = "chesscoach"
version = "0.1.0"
description = "Chess sparring partner that coaches with deterministic detectors and templates (no LLM)."
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = ["chess>=1.11,<2", "pyyaml>=6", "fsrs>=6,<7"]

[project.optional-dependencies]
maia = ["maia2"]
webbuild = ["maia2", "onnx>=1.16", "onnxconverter-common>=1.14", "zstandard>=0.23"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chesscoach*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["engine: needs a Stockfish binary", "maia: needs the maia2 model"]
